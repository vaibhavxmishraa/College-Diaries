<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOD Dashboard — College Diaries</title><link rel="stylesheet" href="css/style.css"><style>.dash{max-width:950px;margin:40px auto}.request{padding:18px;margin:14px 0;border:1px solid #e4d9cb;border-radius:14px;background:#fffdf9}.request h3{margin:0 0 5px}.muted{color:#6c625a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.state{padding:5px 10px;border-radius:999px;background:#f4ead8;display:inline-block}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}</style></head><body><header class="site-header"><div class="container nav-bar"><a class="brand" href="index.html"><span class="brand-name">College <em>Diaries</em></span></a><nav class="site-nav"><a href="index.html">Home</a><button id="logout" class="btn btn-secondary" type="button">HOD Log out</button></nav></div></header><main class="container dash"><p class="eyebrow">Department administration</p><div class="topline"><div><h1>Messaging Access <em>Requests</em></h1><p id="department" class="muted">Loading your department…</p></div><span class="state">HOD Portal</span></div><p>Approve only students who belong to your department. Approval unlocks department-only messaging for that student.</p><div id="notice" class="callout" role="status">Loading requests…</div><div id="requests"></div></main><script>
const box=document.getElementById('requests'),notice=document.getElementById('notice');function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){try{const d=await api('/api/hod/message-requests');document.getElementById('department').textContent='Department: '+d.department;box.innerHTML='';const pending=d.requests.filter(x=>x.status==='pending');notice.textContent=pending.length?pending.length+' request(s) waiting for review.':'No pending requests right now.';if(!d.requests.length){box.innerHTML='<div class="panel request"><h3>No requests yet</h3><p>Student requests from your department will appear here.</p></div>';return}d.requests.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).forEach(x=>{const el=document.createElement('section');el.className='request';el.innerHTML='<h3>'+esc(x.student.name)+'</h3><p class="muted">'+esc(x.student.email)+' · '+esc(x.department)+' · '+(x.student.year?esc(x.student.year)+' year':'Year not added')+'</p><p>Status: <strong>'+esc(x.status)+'</strong></p><p class="muted">Requested '+new Date(x.createdAt).toLocaleString()+'</p>'+(x.status==='pending'?'<div class="actions"><button class="btn btn-primary" data-id="'+esc(x.id)+'" data-decision="approved">Approve</button><button class="btn btn-secondary" data-id="'+esc(x.id)+'" data-decision="rejected">Reject</button></div>':'');box.appendChild(el)});box.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await api('/api/hod/message-requests/'+encodeURIComponent(b.dataset.id)+'/decision',{method:'POST',body:JSON.stringify({decision:b.dataset.decision})});await load()}catch(e){notice.textContent=e.message;b.disabled=false}}))}catch(e){notice.textContent=e.message;if(e.message.includes('HOD'))setTimeout(()=>location.href='hod-login.html',500)}}document.getElementById('logout').addEventListener('click',async()=>{try{await fetch('/api/hod/logout',{method:'POST'})}finally{location.href='hod-login.html'}});load();
</script></body></html>
