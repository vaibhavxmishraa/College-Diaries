<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOD Sign In — College Diaries</title><link rel="stylesheet" href="css/style.css"><style>.portal{max-width:520px;margin:64px auto;padding:28px}.portal label{display:block;margin:14px 0 6px}.portal input{width:100%;padding:12px;border:1px solid #d7cbbb;border-radius:10px}.portal .btn{margin-top:18px}.notice{padding:12px;border-radius:10px;background:#f7f0e5;margin-top:14px;white-space:pre-wrap}</style></head><body><header class="site-header"><div class="container nav-bar"><a class="brand" href="index.html"><span class="brand-name">College <em>Diaries</em></span></a><nav class="site-nav"><a href="index.html">Home</a><a href="login.html">Student Login</a></nav></div></header><main class="container"><section class="panel portal"><p class="eyebrow">Restricted portal</p><h1>HOD <em>Sign In</em></h1><p>Only authorised HOD accounts can review messaging access requests for their own department.</p><form id="hod-login"><label for="email">Official HOD email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn btn-primary" type="submit">Sign in to HOD portal</button></form><p id="notice" class="notice" hidden></p><p><a href="index.html">Back to College Diaries</a></p></section></main><script>
const form=document.getElementById('hod-login'),notice=document.getElementById('notice');form.addEventListener('submit',async e=>{e.preventDefault();notice.hidden=true;try{const r=await fetch('/api/hod/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');location.href='hod-dashboard.html'}catch(err){notice.textContent=err.message;notice.hidden=false}});
</script></body></html>
